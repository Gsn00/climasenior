<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Erro ' + ${status}, ~{::section})}">
<body>
<section class="py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card text-center p-4 p-md-5">
                <div class="card-body">
                    <div class="bg-danger bg-opacity-10 text-danger rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                         style="width: 72px; height: 72px;">
                        <i class="bi bi-exclamation-octagon-fill fs-1"></i>
                    </div>
                    <h1 class="display-5 fw-bold text-danger mb-1" th:text="${status != null ? status : 'Erro'}">404</h1>
                    <h4 class="fw-bold mb-3" th:text="${titulo != null ? titulo : 'Algo deu errado'}">Recurso não encontrado</h4>
                    <p class="text-muted mb-4" th:text="${mensagem != null ? mensagem : 'Não foi possível concluir a sua solicitação.'}">
                        Mensagem detalhada do erro.
                    </p>
                    <a th:href="@{/}" class="btn btn-primary px-4">
                        <i class="bi bi-house-door me-1"></i> Voltar ao Dashboard
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
