<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${ponto.id == null ? 'Novo Ponto de Apoio' : 'Editar Ponto de Apoio'}, ~{::section})}">
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="fw-bold mb-0"
                    th:text="${ponto.id == null ? 'Cadastrar Ponto de Apoio' : 'Editar Ponto de Apoio'}">
                    Cadastrar Ponto de Apoio
                </h2>
                <a th:href="@{/pontos}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Voltar
                </a>
            </div>

            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{/pontos/salvar}" th:object="${ponto}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="nome" class="form-label fw-semibold">Nome do Local *</label>
                                <input type="text" id="nome" th:field="*{nome}" class="form-control"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                       placeholder="Ex: Centro de Convivência do Idoso">
                                <div class="invalid-feedback" th:errors="*{nome}">Erro no nome</div>
                            </div>

                            <div class="col-md-4">
                                <label for="tipo" class="form-label fw-semibold">Tipo de Estrutura *</label>
                                <select id="tipo" th:field="*{tipo}" class="form-select"
                                        th:classappend="${#fields.hasErrors('tipo')} ? 'is-invalid'">
                                    <option value="">Selecione...</option>
                                    <option th:each="t : ${tiposPonto}"
                                            th:value="${t}"
                                            th:text="${t.descricao}">Tipo</option>
                                </select>
                                <div class="invalid-feedback" th:errors="*{tipo}">Erro no tipo</div>
                            </div>

                            <div class="col-md-8">
                                <label for="endereco" class="form-label fw-semibold">Endereço Completo *</label>
                                <input type="text" id="endereco" th:field="*{endereco}" class="form-control"
                                       th:classappend="${#fields.hasErrors('endereco')} ? 'is-invalid'"
                                       placeholder="Ex: Av. Independência, 1250">
                                <div class="invalid-feedback" th:errors="*{endereco}">Erro no endereço</div>
                            </div>

                            <div class="col-md-4">
                                <label for="bairro" class="form-label fw-semibold">Bairro / Região *</label>
                                <input type="text" id="bairro" th:field="*{bairro}" class="form-control"
                                       th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'"
                                       placeholder="Ex: Centro">
                                <div class="invalid-feedback" th:errors="*{bairro}">Erro no bairro</div>
                            </div>

                            <div class="col-md-6">
                                <label for="capacidadeMaxima" class="form-label fw-semibold">Capacidade Máxima (pessoas) *</label>
                                <input type="number" id="capacidadeMaxima" th:field="*{capacidadeMaxima}" class="form-control"
                                       th:classappend="${#fields.hasErrors('capacidadeMaxima')} ? 'is-invalid'"
                                       min="1" placeholder="Ex: 50">
                                <div class="invalid-feedback" th:errors="*{capacidadeMaxima}">Erro na capacidade</div>
                            </div>

                            <div class="col-md-6 d-flex align-items-end">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="ativo" th:field="*{ativo}">
                                    <label class="form-check-label fw-semibold" for="ativo">
                                        Ponto de apoio ativo e disponível
                                    </label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/pontos}" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i> Salvar Ponto de Apoio
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
