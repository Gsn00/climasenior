<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(${cidadao.id == null ? 'Novo Cidadão' : 'Editar Cidadão'}, ~{::section})}">
<body>
<section>
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2 class="fw-bold mb-0"
                    th:text="${cidadao.id == null ? 'Cadastrar Cidadão' : 'Editar Cadastro do Cidadão'}">
                    Cadastrar Cidadão
                </h2>
                <a th:href="@{/cidadaos}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left me-1"></i> Voltar
                </a>
            </div>

            <div class="card">
                <div class="card-body p-4">
                    <form th:action="@{/cidadaos/salvar}" th:object="${cidadao}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <div class="col-md-8">
                                <label for="nomeCompleto" class="form-label fw-semibold">Nome Completo *</label>
                                <input type="text" id="nomeCompleto" th:field="*{nomeCompleto}" class="form-control"
                                       th:classappend="${#fields.hasErrors('nomeCompleto')} ? 'is-invalid'"
                                       placeholder="Ex: José Antônio Oliveira">
                                <div class="invalid-feedback" th:errors="*{nomeCompleto}">Erro no nome</div>
                            </div>

                            <div class="col-md-4">
                                <label for="cpf" class="form-label fw-semibold">CPF *</label>
                                <input type="text" id="cpf" th:field="*{cpf}" class="form-control"
                                       th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                                       placeholder="000.000.000-00">
                                <div class="invalid-feedback" th:errors="*{cpf}">Erro no CPF</div>
                            </div>

                            <div class="col-md-4">
                                <label for="dataNascimento" class="form-label fw-semibold">Data de Nascimento *</label>
                                <input type="date" id="dataNascimento" th:field="*{dataNascimento}" class="form-control"
                                       th:classappend="${#fields.hasErrors('dataNascimento')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:errors="*{dataNascimento}">Erro na data</div>
                            </div>

                            <div class="col-md-4">
                                <label for="telefone" class="form-label fw-semibold">Telefone de Contato *</label>
                                <input type="text" id="telefone" th:field="*{telefone}" class="form-control"
                                       th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                                       placeholder="(19) 99999-9999">
                                <div class="invalid-feedback" th:errors="*{telefone}">Erro no telefone</div>
                            </div>

                            <div class="col-md-4">
                                <label for="bairro" class="form-label fw-semibold">Bairro de Residência *</label>
                                <input type="text" id="bairro" th:field="*{bairro}" class="form-control"
                                       th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'"
                                       placeholder="Ex: Vila Rezende">
                                <div class="invalid-feedback" th:errors="*{bairro}">Erro no bairro</div>
                            </div>

                            <div class="col-12">
                                <label for="observacaoSaude" class="form-label fw-semibold">Observações de Saúde / Condições Crônicas</label>
                                <textarea id="observacaoSaude" th:field="*{observacaoSaude}" class="form-control" rows="3"
                                          th:classappend="${#fields.hasErrors('observacaoSaude')} ? 'is-invalid'"
                                          placeholder="Ex: Hipertensão, diabetes, uso contínuo de medicamentos..."></textarea>
                                <div class="invalid-feedback" th:errors="*{observacaoSaude}">Erro na observação</div>
                            </div>

                            <div class="col-12">
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="mobilidadeReduzida"
                                           th:field="*{mobilidadeReduzida}">
                                    <label class="form-check-label fw-semibold" for="mobilidadeReduzida">
                                        Possui mobilidade reduzida (requer atendimento/transporte prioritário em emergências)
                                    </label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/cidadaos}" class="btn btn-light">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check-lg me-1"></i> Salvar Cidadão
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
